# .github/workflows/docker-publish.yml
# Build and publish Docker images for client and oracle to GHCR.

name: Docker Publish

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/agentic2026/hackcanada

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: ./client
            role: client
          - context: ./oracle
            role: oracle

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # role-latest
            type=raw,value=${{ matrix.role }}-latest,enable={{is_default_branch}}
            # role-<sha>
            type=raw,value=${{ matrix.role }}-{{sha}}
            # role-v1.2.3 on semver tags
            type=semver,pattern=${{ matrix.role }}-{{version}}
            type=semver,pattern=${{ matrix.role }}-{{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=hackcanada-${{ matrix.role }}
            org.opencontainers.image.description=HackCanada ${{ matrix.role }} service
            org.opencontainers.image.source=https://github.com/Agentic2026/HackCanada

      - name: Build and push
        id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198571cfb76f00 # v6.18.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@db473fddc028af60658334401dc6fa3ffd8669fd # v2.3.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
