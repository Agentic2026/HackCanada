# .github/workflows/docker-publish.yml
# Build and publish Docker images for client and oracle to GHCR.

name: Docker Publish

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/agentic2026/hackcanada

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: ./client
            role: client
          - context: ./oracle
            role: oracle

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # role-latest
            type=raw,value=${{ matrix.role }}-latest,enable={{is_default_branch}}
            # role-<sha>
            type=raw,value=${{ matrix.role }}-{{sha}}
            # role-v1.2.3 on semver tags
            type=semver,pattern=${{ matrix.role }}-{{version}}
            type=semver,pattern=${{ matrix.role }}-{{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=hackcanada-${{ matrix.role }}
            org.opencontainers.image.description=HackCanada ${{ matrix.role }} service
            org.opencontainers.image.source=https://github.com/Agentic2026/HackCanada

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
